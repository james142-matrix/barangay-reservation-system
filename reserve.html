<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Reservation - Barangay Molugan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">🏛️ Barangay Molugan</a>
</nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="resident-dashboard.html">📊 Dashboard</a></li>
            <li><a href="facilities.html">🏛️ Facilities</a></li>
            <li><a href="reserve.html" class="active">📝 New Reservation</a></li>
            <li><a href="my-reservations.html">📋 My Reservations</a></li>
            <li><a href="billing.html">💳 Billing</a></li>
            <li><a href="#" onclick="logout()">🚪 Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header">
            <h1>Create New Reservation</h1>
            <div class="notification-wrap">
                <button id="notificationToggleBtn" class="btn notification-trigger" type="button">
                    🔔 Notifications <span id="notificationBadge" class="notification-dot-count"></span>
                </button>
                <div id="notificationPanel" class="notification-panel"></div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 680px 420px; gap:12px; max-width:1120px; margin:0 auto; align-items:start; justify-content:center;">
            <div class="table-container" style="width:100%; max-width:none;">
                <div style="padding: 30px;">
                    <form onsubmit="submitReservation(event)">
                        <div class="form-group">
                            <label for="facility">Select Facility *</label>
                            <select id="facility" required>
                                <option value="">-- Choose a Facility --</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventDate">Start Date *</label>
                                <input type="date" id="eventDate" required>
                            </div>
                            <div class="form-group">
                                <label for="eventEndDate">End Date *</label>
                                <input type="date" id="eventEndDate" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="startTime">Start Time *</label>
                                <input type="time" id="startTime" required>
                            </div>
                            <div class="form-group">
                                <label for="endTime">End Time *</label>
                                <input type="time" id="endTime" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="eventType">Event Type *</label>
                            <select id="eventType" required>
                                <option value="">-- Select Event Type --</option>
                                <option value="Birthday">Birthday Party</option>
                                <option value="Wedding">Wedding</option>
                                <option value="Conference">Conference</option>
                                <option value="Community">Community Event</option>
                                <option value="Sports">Sports Activity</option>
                                <option value="Training">Training/Workshop</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="expectedGuests">Expected Guests *</label>
                            <input type="number" id="expectedGuests" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="eventDescription">Event Description</label>
                            <textarea id="eventDescription" rows="4" placeholder="Describe your event..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="contactPerson">Contact Person *</label>
                            <input type="text" id="contactPerson" required>
                        </div>

                        <div class="form-group">
                            <label for="contactPhone">Contact Phone *</label>
                            <input type="tel" id="contactPhone" required>
                        </div>

                        <div style="margin-top: 30px; display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary">Submit Reservation</button>
                            <a href="facilities.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cost Summary Sidebar -->
            <div class="table-container" style="width:100%; max-width:none; min-height:380px; height:fit-content; position:sticky; top:100px;">
                <div class="table-header">
                    <h2>Cost Summary</h2>
                </div>
                <div style="padding: 20px;">
                    <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0;">
                        <p style="color: #888; font-size: 14px; margin-bottom: 5px;">Facility Price</p>
                        <p style="font-size: 20px; font-weight: 700; color: #667eea;" id="facilityPrice">₱0</p>
                    </div>
                    <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0;">
                        <p style="color: #888; font-size: 14px; margin-bottom: 5px;">Duration</p>
                        <p style="font-size: 14px;" id="duration">-</p>
                    </div>
                    <div style="background: #f5f7fa; padding: 15px; border-radius: 8px;">
                        <p style="color: #888; font-size: 12px; margin-bottom: 8px;">TOTAL COST</p>
                        <p style="font-size: 24px; font-weight: 700; color: #667eea;" id="totalCost">₱0</p>
                        <p style="color: #888; font-size: 12px; margin-top: 10px;">Payment upon approval</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reserve.js"></script>
    <script src="js/responsive.js"></script>
</body>
</html>
