<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities - Barangay Molugan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">🏛️ Barangay Molugan - Staff</a>
</nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="barangay-staff-dashboard.html">📊 Dashboard</a></li>
            <li><a href="barangay-staff-requests.html">📋 Approval Requests</a></li>
            <li><a href="barangay-staff-billing.html">💳 Billing</a></li>
            <li><a href="barangay-staff-facilities.html" class="active">🏛️ Facilities</a></li>
            <li><a href="#" onclick="logout()">🚪 Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header">
            <h1>Facilities Overview</h1>
            <p style="color: #666; margin-top: 5px;">View all available facilities and their current status</p>
        </div>

        <!-- Facilities Cards Grid -->
        <div id="facilities-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <!-- Facilities will be loaded here -->
        </div>

        <!-- Facilities Reservations Summary -->
        <div class="table-container">
            <div class="table-header">
                <h2>Facility Reservations Today</h2>
            </div>
            <div id="today-reservations">
                <!-- Today's reservations will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Facility Details Modal -->
    <div id="facilityModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Facility Details</h2>
                <button class="close-modal" onclick="closeFacilityModal()">×</button>
            </div>
            <div class="modal-body" id="facilityDetails">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFacilityModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/barangay-staff-facilities.js"></script>
    <script src="js/responsive.js"></script>
</body>
</html>
