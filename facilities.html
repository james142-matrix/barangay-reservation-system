<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Facilities - Barangay Molugan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">🏛️ Barangay Molugan</a>
        <ul class="nav-links">
            <li><a href="resident-dashboard.html">Dashboard</a></li>
            <li><a href="facilities.html" class="active">Browse Facilities</a></li>
            <li><a href="reserve.html">Make Reservation</a></li>
            <li><a href="my-reservations.html">My Reservations</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="#" onclick="logout()" class="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="resident-dashboard.html">📊 Dashboard</a></li>
            <li><a href="facilities.html" class="active">🏛️ Facilities</a></li>
            <li><a href="reserve.html">📝 New Reservation</a></li>
            <li><a href="my-reservations.html">📋 My Reservations</a></li>
            <li><a href="billing.html">💳 Billing</a></li>
            <li><a href="#" onclick="logout()">🚪 Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header">
            <h1>Browse Our Facilities</h1>
            <div style="position:relative;">
                <button onclick="toggleNotifications()" style="background:#2a5298; color:white; padding:8px 15px; border:none; border-radius:5px; cursor:pointer;">
                    🔔 Notifications <span id="notificationBadge" style="background:red; color:white; padding:2px 6px; border-radius:50%; margin-left:5px; font-size:12px;"></span>
                </button>
                <div id="notificationPanel" style="display:none; position:absolute; right:0; top:40px; width:300px; background:white; border:1px solid #ddd; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-height:400px; overflow-y:auto; z-index:100;">
                </div>
            </div>
        </div>

        <div id="facilities-container" class="facilities-grid">
            <!-- Facilities will be loaded here -->
        </div>
    </main>

    <!-- Facility Detail Modal -->
    <div id="facilityModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Facility Details</h2>
                <button class="close-modal" onclick="closeFacilityModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFacilityModal()">Close</button>
                <button class="btn btn-primary" onclick="goToReserve()">Make Reservation</button>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/facilities.js"></script>
    <script src="js/responsive.js"></script>
</body>
</html>
