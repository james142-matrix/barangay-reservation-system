<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations - Barangay Molugan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">🏛️ Barangay Molugan</a>
        <ul class="nav-links">
            <li><a href="resident-dashboard.html">Dashboard</a></li>
            <li><a href="facilities.html">Browse Facilities</a></li>
            <li><a href="reserve.html">Make Reservation</a></li>
            <li><a href="my-reservations.html" class="active">My Reservations</a></li>
            <li><a href="#" onclick="logout()" class="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="resident-dashboard.html">📊 Dashboard</a></li>
            <li><a href="facilities.html">🏛️ Facilities</a></li>
            <li><a href="reserve.html">📝 New Reservation</a></li>
            <li><a href="my-reservations.html" class="active">📋 My Reservations</a></li>
            <li><a href="#" onclick="logout()">🚪 Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header">
            <h1>My Reservations</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div style="position:relative;">
                    <button onclick="toggleNotifications()" style="background:#2a5298; color:white; padding:8px 15px; border:none; border-radius:5px; cursor:pointer;">
                        🔔 Notifications <span id="notificationBadge" style="background:red; color:white; padding:2px 6px; border-radius:50%; margin-left:5px; font-size:12px;"></span>
                    </button>
                    <div id="notificationPanel" style="display:none; position:absolute; right:0; top:40px; width:300px; background:white; border:1px solid #ddd; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-height:400px; overflow-y:auto; z-index:100;">
                    </div>
                </div>
                <a href="reserve.html" class="btn btn-primary">➕ New Reservation</a>
            </div>
        </div>

        <!-- Filter  -->
        <div class="table-container" style="margin-bottom: 20px;">
            <div style="padding: 15px; display: flex; gap: 15px; align-items: center;">
                <label for="statusFilter" style="font-weight: 500;">Filter by Status:</label>
                <select id="statusFilter" onchange="filterReservations()" style="padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 6px; width: 200px;">
                    <option value="">All Reservations</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
        </div>

        <!-- Reservations Table -->
        <div class="table-container">
            <div id="reservations-list">
                <!-- Reservations will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Reservation Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reservation Details</h2>
                <button class="close-modal" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body" id="detailBody">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
                <button class="btn btn-danger" id="cancelBtnModal" onclick="cancelReservation()" style="display:none;">Cancel Reservation</button>
            </div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/my-reservations.js"></script>
    <script src="js/responsive.js"></script>
</body>
</html>
